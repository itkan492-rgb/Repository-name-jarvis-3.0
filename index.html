<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FRIDAY AI</title>

<style>

body{
margin:0;
padding:0;
background:black;
font-family:Arial;
overflow:hidden;
}

.container{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
}

h1{
color:cyan;
font-size:42px;
text-shadow:0 0 20px cyan;
margin-top:20px;
}

.orb{
width:180px;
height:180px;
border-radius:50%;
background:radial-gradient(circle,#ff00ff,#00ffff);
box-shadow:0 0 50px #00ffff;
position:relative;
animation:pulse 2s infinite;
}

.orb::before{
content:"";
position:absolute;
top:-15px;
left:-15px;
width:210px;
height:210px;
border-radius:50%;
border:3px solid #ff0080;
animation:rotate 4s linear infinite;
}

@keyframes rotate{
0%{
transform:rotate(0deg);
}
100%{
transform:rotate(360deg);
}
}

@keyframes pulse{
0%{
transform:scale(1);
}
50%{
transform:scale(1.1);
}
100%{
transform:scale(1);
}
}

button{
width:240px;
padding:15px;
margin:10px;
border:none;
border-radius:12px;
background:cyan;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 15px cyan;
}

button:hover{
background:#00ffff;
transform:scale(1.05);
}

.status{
color:lime;
font-size:22px;
margin-top:20px;
}

p{
color:white;
font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<div class="orb"></div>

<h1>FRIDAY AI</h1>

<p>Welcome Rahul 👋</p>

<button onclick="startVoice()">
🎤 Start Voice
</button>

<button onclick="openChat()">
💬 Open Chat
</button>

<button onclick="openTerminal()">
💻 Open Terminal
</button>

<p class="status">
System Ready ✅
</p>

</div>

<script>

function startVoice(){

let recognition =
new webkitSpeechRecognition();

recognition.lang="hi-IN";

recognition.start();

recognition.onresult=function(event){

let text =
event.results[0][0].transcript;

let reply = "Hello Rahul";

if(text.includes("hello") || text.includes("friday")){
reply = "Hello Rahul, main FRIDAY AI ready hoon";
}

if(text.includes("time")){
reply = "Current time ready";
}

if(text.includes("open chat")){
reply = "Opening chat system";
openChat();
}

if(text.includes("open terminal")){
reply = "Opening terminal";
openTerminal();
}

let speech =
new SpeechSynthesisUtterance(reply);

speech.lang="hi-IN";

speechSynthesis.speak(speech);

}

}

function openChat(){
alert("FRIDAY Chat System Ready 🚀");
}

function openTerminal(){
alert("FRIDAY Terminal Ready 💻");
}

</script>

</body>
</html>
