<body>
<div class="orb"></div>
<h1>FRIDAY AI</h1>

<p>Welcome Rahul 👋</p>

<button onclick="startVoice()">
🎤 Start Voice
</button>

<br>

<button onclick="window.location.href='chat.html'">
💬 Open Chat
</button>

<br>

<button onclick="window.location.href='terminal.html'">
💻 Open Terminal
</button>

<p class="status">
System Ready ✅
</p>

<script>

function startVoice() {

const recognition =
new webkitSpeechRecognition();

recognition.lang = "hi-IN";

recognition.onresult = function(event) {

let command =
event.results[0][0].transcript;

let reply = "Maine suna: " + command;

if(command.includes("hello") || command.includes("friday")){
reply = "Hello Rahul, main Friday AI ready hoon";
}

let speech = new SpeechSynthesisUtterance(reply);
speech.lang = "hi-IN";
window.speechSynthesis.speak(speech);

if(command.includes("chat")) {
window.location.href = "chat.html";
}

if(command.includes("terminal")) {
window.location.href = "terminal.html";
}

};

recognition.start();

}

</script>
