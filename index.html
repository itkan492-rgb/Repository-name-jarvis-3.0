<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FRIDAY AI</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
text-align:center;
padding-top:30px;
overflow:hidden;
}

/* TITLE */

h1{
color:cyan;
font-size:40px;
text-shadow:
0 0 10px cyan,
0 0 20px cyan,
0 0 40px cyan;
}

/* ORB */

.orb{
width:180px;
height:180px;
background:radial-gradient(circle,#ff00ff,#6600ff);
border-radius:50%;
margin:30px auto;
animation:pulse 2s infinite;
box-shadow:0 0 40px #ff00ff;
position:relative;
}

/* ROTATING RING */

.orb::before{
content:"";
position:absolute;
top:-20px;
left:-20px;
width:220px;
height:220px;
border:3px solid #ff0066;
border-radius:50%;
animation:rotate 4s linear infinite;
}

/* SMALL DOTS */

.orb::after{
content:"";
position:absolute;
top:-10px;
left:80px;
width:20px;
height:20px;
background:white;
border-radius:50%;
box-shadow:
0 0 20px white,
0 0 40px cyan;
}

/* BUTTONS */

button{
width:220px;
padding:15px;
margin:10px;
border:none;
border-radius:10px;
background:cyan;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
background:#00ffee;
}

/* STATUS */

.status{
color:lime;
font-size:22px;
margin-top:20px;
}

/* ANIMATIONS */

@keyframes pulse{
0%{
transform:scale(1);
}
50%{
transform:scale(1.1);
}
100%{
transform:scale(1);
}
}

@keyframes rotate{
0%{
transform:rotate(0deg);
}
100%{
transform:rotate(360deg);
}
}

</style>
</head>

<body>

<h1>FRIDAY AI</h1>

<div class="orb"></div>

<p>Welcome Rahul 👋</p>

<button onclick="startVoice()">
🎤 Start Voice
</button>

<br>

<button onclick="window.open('https://chat.openai.com')">
💬 Open ChatGPT
</button>

<br>

<button onclick="window.open('https://youtube.com')">
▶ Open YouTube
</button>

<p class="status">
System Ready ✅
</p>

<script>

function startVoice(){

const recognition =
new webkitSpeechRecognition();

recognition.lang = "hi-IN";

recognition.onresult = function(event){

let command =
event.results[0][0].transcript.toLowerCase();

let reply = "Maine suna: " + command;

/* HELLO */

if(command.includes("hello") ||
command.includes("friday")){

reply =
"Hello Rahul, main Friday AI ready hoon";
}

/* HOW ARE YOU */

if(command.includes("kaise ho")){

reply =
"Main bilkul theek hoon Rahul";
}

/* TIME */

if(command.includes("time")){

reply =
"Abhi time hai " +
new Date().toLocaleTimeString();
}

/* OPEN YOUTUBE */

if(command.includes("youtube")){

window.open("https://youtube.com");

reply =
"YouTube khol raha hoon";
}

/* OPEN GOOGLE */

if(command.includes("google")){

window.open("https://google.com");

reply =
"Google khol raha hoon";
}

/* OPEN CHATGPT */

if(command.includes("chat")){

window.open("https://chat.openai.com");

reply =
"ChatGPT khol raha hoon";
}

/* SPEAK */

let speech =
new SpeechSynthesisUtterance(reply);

speech.lang = "hi-IN";

window.speechSynthesis.speak(speech);

alert(reply);

};

recognition.start();

}

</script>

</body>
</html>
